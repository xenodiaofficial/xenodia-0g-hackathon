  <script type="text/plain" id="skill-finder-md">---
name: skill-finder
description: 当用户分享一个 skill 仓库或 skill 介绍页（GitHub / 网页 URL），并希望找到"同赛道"、"类似的"、"同生态"或"同类型"的其他 skill 时，必须使用此 skill。
---

# skill-finder

把"给我一个 skill，帮我找同赛道的"这件事变成一个可重复执行的流程。

## 流程总览（四步）

1. 拆解参考 skill 的"赛道画像"——不要急着搜
2. 五条并行搜索路线——铺开候选池
3. 逐个核验——任何"看起来对"的归属都要 fetch 验证
4. 分档输出 + 推荐顺序——而不是平铺一张大表

## 第一步：拆解参考 skill 的"赛道画像"

读 README / SKILL.md，抽 6 个维度的标签：语言 / 内容形态 / 平台生态 / 风格哲学 / 格式标准 / 作者圈层。
额外抓两类强信号：反模式词（参考 skill 反对什么），致谢与引用（README/issues 里被点名的人和 repo）。

## 第二步：五条并行搜索路线

A. **GitHub 倒查**：fetch 参考仓库的 stargazers / forks / dependents 页。
B. **沿"人"找**：把"作者圈层"展开成具体名单。
C. **使用场景换皮搜索**：把【内容形态 + 平台】做笛卡尔积。
D. **反模式关键词**：把抓到的反模式词直接搜。
E. **平台内置发现 + 社区策展**。

## 第三步：逐个核验（硬约束）

每个候选都要做：
1. HTTP 200 校验
2. 作者归属校验
3. README 一句话事实摘录

无法核验的剔除。

## 第四步：分档输出

**S 级 · 直接同赛道**：同语言+同内容形态+同风格哲学+同格式 至少三条
**A 级 · 同生态、思路同源**：平台不同但骨架一样
**B 级 · 边缘但有用**：垂直细分、反向工具、prompt 库

每条格式：`- [仓库名](URL) — 一句话事实描述。一句话推荐理由。[✓ HTTP 200 · 作者: handle · 非冒名]`

## 输出模板（严格）

```markdown
## 参考 skill 的赛道画像
[3-5 行]

## S 级 · 直接同赛道
- [repo](url) — 描述。理由。

## A 级 · 同生态、思路同源
- ...

## B 级 · 边缘但有用
- ...

## 给你的下一步建议
[2-3 条具体行动]
```</script>

  // Deterministic hash for synth values
  function hashSlug(s){ let h = 5381; for (let i = 0; i < s.length; i++) h = ((h * 33) ^ s.charCodeAt(i)) >>> 0; return h; }

  function transformSkill(raw, track){
    const h = hashSlug(raw.slug);
    const stars = raw.stars > 0 ? raw.stars : 200 + (h % 4500);
    const adopted = Math.round(stars * (1.6 + ((h >> 7) % 80) / 50));
    const addedDays = 1 + (h % 28);
    const description = (raw.usage.split(/\n\n/)[0] || raw.tagline).trim();
    const sceneMatch = raw.usage.match(/场景[：:]\s*([^\n]+)/);
    let scenarios;
    if (sceneMatch) {
      scenarios = sceneMatch[1].split(/[、，;；,]/).map(s => s.trim().replace(/[。.]+$/, '')).filter(Boolean).slice(0, 3);
    } else {
      scenarios = [raw.tagline];
    }
    const installMatch = raw.usage.match(/安装[：:]\s*([^\n。]+)/);
    const install = installMatch ? installMatch[1].trim() : `claude skills add ${raw.slug}`;
    const runtime = ['Claude Code'];
    if (/Cursor/i.test(raw.usage)) runtime.push('Cursor');
    if (/Codex/i.test(raw.usage)) runtime.push('Codex');
    if (/Gemini/i.test(raw.usage)) runtime.push('Gemini CLI');
    return {
      id: raw.slug,
      name: raw.name,
      tagline: raw.tagline,
      track,
      subtags: raw.tags,
      author: raw.author,
      repo: raw.repo_url.replace(/^https?:\/\//, ''),
      repoUrl: raw.repo_url,
      stars,
      verified: !!raw.verified,
      adopted,
      addedDays,
      scenarios,
      runtime,
      description,
      install,
    };
  }

  window.SKILLS = [
    ...RAW_SKILLS.research.map(r => transformSkill(r, 'research')),
    ...RAW_SKILLS.trading.map(r => transformSkill(r, 'trading')),
    ...RAW_SKILLS.writing.map(r => transformSkill(r, 'writing')),
  ];

  // Compute tracks dynamically — top subtags per track from real data
  function computeTracks(skills){
    const trackMeta = {
      research: { label: 'Research', glyph: 'R', sub: 'Deep, academic, market, competitive, user research' },
      trading:  { label: 'Trading',  glyph: 'T', sub: 'Equities, options, crypto, macro, portfolio' },
      writing:  { label: 'Writing',  glyph: 'W', sub: 'Technical, longform, shortform, marketing, fiction' },
    };
    return Object.keys(trackMeta).map(id => {
      const inTrack = skills.filter(s => s.track === id);
      const counts = {};
      inTrack.forEach(s => s.subtags.forEach(tag => counts[tag] = (counts[tag] || 0) + 1));
      const top = Object.entries(counts).sort((a,b) => b[1] - a[1]).slice(0, 8).map(([tag]) => ({ id: tag, label: tag }));
      return { id, label: trackMeta[id].label, glyph: trackMeta[id].glyph, sub: trackMeta[id].sub, subtags: top };
    });
  }
  window.TRACKS = computeTracks(window.SKILLS);

  // ── Xenodia config ──────────────────────────────────────────────────
  const CFG_KEY = 'skillhunter.cfg.v3';

    apiKey: '', // fill via ⚙︎ API settings — never commit a real key here

    'claude-sonnet-4-6','claude-opus-4-6','claude-opus-4-7',

  window.getCfg = function(){
    let saved = {};
    try { saved = JSON.parse(localStorage.getItem(CFG_KEY) || '{}'); } catch {}
    const m = (saved.model || '').trim();
    return {
      baseUrl: saved.baseUrl || DEFAULT_CFG.baseUrl,
      apiKey:  saved.apiKey  || DEFAULT_CFG.apiKey,
      model:   XENODIA_CLAUDE_MODELS.has(m) ? m : DEFAULT_CFG.model,
    };

  window.saveCfg = function(c){ localStorage.setItem(CFG_KEY, JSON.stringify(c)); };

  class ApiError extends Error {
    constructor(stage, status, statusText, body, url){
      super(`[${stage}] ${status} ${statusText}`);
      this.stage = stage; this.status = status; this.statusText = statusText;
      this.body = body; this.url = url;
    }
  }
  window.ApiError = ApiError;

  window.callApi = async function(cfg, body){
    const url = `${cfg.baseUrl || 'https://api.xenodia.xyz'}/v1/chat/completions`;
    let resp;
    try {
      resp = await fetch(url, {
        method: 'POST',
        headers: { 'authorization': `Bearer ${cfg.apiKey}`, 'content-type': 'application/json' },
        body: JSON.stringify(body),
      });
    } catch (e) {
      throw new ApiError('network', 0, 'Network/CORS error', e.message, url);
    }
    const text = await resp.text();
    let data;
    try { data = JSON.parse(text); }
    catch { throw new ApiError('parse', resp.status, resp.statusText, text.slice(0, 500), url); }
    if (!resp.ok || data.error){
      const e = data.error || data;
      throw new ApiError('api', resp.status, e.type || e.code || resp.statusText, e.message || JSON.stringify(e).slice(0, 500), url);
    }
    return data;
  };

  window.extractText = function(data){
    const choices = data.choices || [];
    return choices.map(c => (c.message && c.message.content) || c.text || '').join('\n').trim();

  function isUrlLike(s){ return /^https?:\/\//i.test(s.trim()) || /^[\w-]+\/[\w.-]+$/.test(s.trim()); }
  function normalizeRepoUrl(s){ s = s.trim(); if (/^[\w-]+\/[\w.-]+$/.test(s)) return 'https://github.com/' + s; return s; }
  window.isUrlLike = isUrlLike;

  window.callSkillFinder = async function(input, onStatus){
    const cfg = window.getCfg();
    if (!cfg.apiKey) throw new Error('Missing API Key. Open ⚙ API to fill it.');
    const finderMd = document.getElementById('skill-finder-md').textContent;
    const isUrl = isUrlLike(input);
    const userMsg = isUrl
      ? `参考 skill 仓库：${normalizeRepoUrl(input)}\n\n按 skill-finder 流程列出 5-10 个同赛道的 skill。按 S/A/B 三档输出 markdown，每条带 GitHub URL 与一句话理由，结尾标注【未实时核验】。`
      : `用户意图：${input}\n\n直接：1) 推断赛道画像（语言/形态/平台/风格）；2) 列出最匹配的真实 skill；3) 按 S/A/B 三档 markdown 输出，每条 GitHub URL，控制 6-12 条。每条结尾标【未实时核验】。`;
    const system = `你是 skill-finder agent。${finderMd}\n\n额外约束：\n- 用户已看过本站 50 个内置 skill，重点找站外新候选。\n- 输出 markdown（## / - / [text](url)）。\n- 真实 URL，不编造。\n\n⚠️ 当前网关（Xenodia OpenAI 兼容）不提供 web_search 工具。请基于训练知识列出最可能真实的 GitHub 仓库，每条结尾标【未实时核验】。`;
    onStatus && onStatus('调用 Xenodia · OpenAI 兼容 /v1/chat/completions');
    const data = await window.callApi(cfg, {
      model: cfg.model || 'claude-sonnet-4-6',
      max_tokens: 4096,
      messages: [{ role: 'system', content: system }, { role: 'user', content: userMsg }],
    });
    const md = window.extractText(data);
    if (!md) throw new ApiError('empty', 200, 'OK', JSON.stringify(data).slice(0, 500), 'response.choices');
    return { md, usedSearch: false };
  };

  // Tiny markdown renderer for AI panel right column
  window.mdToHtml = function(md){
    const esc = s => s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
    let html = esc(md);
    html = html.replace(/```([\s\S]*?)```/g, (_, c) => `<pre>${c}</pre>`);
    html = html.replace(/`([^`\n]+)`/g, (_, c) => `<code>${c}</code>`);
    html = html.replace(/^#### (.+)$/gm, '<h4>$1</h4>');
    html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
    html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
    html = html.replace(/^# (.+)$/gm, '<h2>$1</h2>');
    html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (_, t, u) => `<a href="${u}" target="_blank" rel="noreferrer">${t}</a>`);
    html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    html = html.replace(/^(\s*)[-*] (.+)$/gm, '<li>$2</li>');
    html = html.replace(/(<li>[\s\S]*?<\/li>\n?)+/g, m => `<ul>${m}</ul>`);
    html = html.split(/\n\n+/).map(p => /^<(h\d|ul|pre|li)/.test(p.trim()) ? p : `<p>${p.replace(/\n/g, '<br/>')}</p>`).join('\n');
    return html;
  };

  window.LANG_STATE = { current: (navigator.language || '').toLowerCase().startsWith('zh') ? 'zh' : 'en', listeners: [] };
  window.useLang = function(){
    const [lang, setLang] = React.useState(window.LANG_STATE.current);
    React.useEffect(() => {
      const fn = (l) => setLang(l);
      window.LANG_STATE.listeners.push(fn);
      return () => { window.LANG_STATE.listeners = window.LANG_STATE.listeners.filter(x => x !== fn); };
    }, []);
    const t = window.I18N[lang];
    const setLanguage = (l) => {
      window.LANG_STATE.current = l;
      window.LANG_STATE.listeners.forEach(fn => fn(l));
    };
    return { lang, t, setLanguage };
  };
  </script>

  // ── Streaming AI plan ─────────────────────────────────────────────
  function StreamingPlan({ query, done }) {
    const { t } = window.useLang();
    const lines = [t.plan_intent, t.plan_site, t.plan_trust, t.plan_ext, t.plan_done];
    const [shown, setShown] = useState(0);
    useEffect(() => {
      if (shown >= lines.length) { done && done(); return; }
      const tm = setTimeout(() => setShown(shown + 1), 320);
      return () => clearTimeout(tm);
    }, [shown]);
    return (
      <div>
        <div className="stream-line" style={{ marginBottom: 10 }}>
          <span className="ai-tag">[plan]</span>{" "}
          <span style={{ color: "var(--ink-2)" }}>"{query}"</span>
        </div>
        {lines.slice(0, shown).map((line, i) => (
          <div key={i} className="stream-line">
            <span className={i === lines.length - 1 ? "ok" : ""}>{line}</span>
          </div>
        ))}
        {shown < lines.length && <div className="stream-line"><span className="streaming-dot" /></div>}
      </div>
    );
  }

              <span style={{ width: 6, height: 6, background: "var(--trust-verified)", borderRadius: 999, display: "inline-block" }} />
              {t.hero_caption_a}
            </span>
            <span>·</span>
            <span>{t.hero_caption_b} <span className="kbd">↵</span> {t.hero_caption_c} · <span className="kbd">/</span> {t.hero_caption_d}</span>
          </div>
        </div>
      </section>
    );
  }

  // ── AI panel — wired to live Xenodia ──────────────────────────────
  function AiPanel({ query, onClose, onOpen }) {
    const { t } = window.useLang();
    const [planDone, setPlanDone] = useState(false);
    const [remoteState, setRemoteState] = useState({ status: 'pending', md: '', err: null, statusText: '' });

    // Local ranking — keyword + verified + adoption
    const ranked = useMemo(() => {
      const q = query.toLowerCase();
      const kws = q.split(/\s+/).filter(w => w.length > 2);
      const scored = window.SKILLS.map((s) => {
        const blob = (s.name + " " + s.tagline + " " + s.subtags.join(" ") + " " + s.scenarios.join(" ") + " " + s.description).toLowerCase();
        let score = 0;
        kws.forEach(k => { if (blob.includes(k)) score += 3; });
        if (s.verified) score += 1;
        score += Math.log10(1 + s.adopted) * 0.3;
        return { s, score };
      });
      scored.sort((a, b) => b.score - a.score);
      return scored.slice(0, 6).map(x => x.s);
    }, [query]);

    const reasons = [
      t.lang === 'zh' ? "和你的措辞最贴近，覆盖核心场景" : "Closest match to your phrasing — covers the core scenario.",
      "Adjacent — handles the upstream step of what you described.",
      "Same shape, different domain emphasis.",
      "Lighter-weight option — faster to install, fewer features.",
      "Same author cluster, often used in tandem.",
      "Wildcard. Different metaphor, but solves the underlying job.",
    ];

    useEffect(() => {
      let alive = true;
      setRemoteState({ status: 'pending', md: '', err: null, statusText: t.ai_loading });
      window.callSkillFinder(query, (msg) => { if (alive) setRemoteState(r => ({ ...r, statusText: msg })); })
        .then(({ md }) => { if (alive) setRemoteState({ status: 'ok', md, err: null, statusText: '' }); })
        .catch(err => { if (alive) setRemoteState({ status: 'error', md: '', err, statusText: '' }); });
      return () => { alive = false; };
    }, [query]);

    return (
      <section className="ai-panel" style={{ margin: "0 28px 56px", maxWidth: 1320, marginLeft: "auto", marginRight: "auto" }}>
        <div className="aurora" style={{ height: "100%", opacity: 0.4 }} />
        <div style={{ position: "relative", zIndex: 2, padding: "22px 24px" }}>
          <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", marginBottom: 18 }}>
            <div>
              <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 6 }}>
                <span className="section-label" style={{ color: "var(--ai)" }}>{t.ai_result_label}</span>
                <span className="streaming-dot" />
              </div>
              <div style={{ fontSize: 22, fontWeight: 600, letterSpacing: "-0.01em", maxWidth: 800 }}>
                {query}
              </div>
            </div>
            <button onClick={onClose} className="mono" style={{
              padding: "6px 10px", border: "1px solid var(--line-strong)", color: "var(--ink-2)", fontSize: 11,
            }}>
              {t.ai_close}
            </button>
          </div>

          <div style={{ padding: "14px 16px", border: "1px solid var(--line)", marginBottom: 18, background: "rgba(0,0,0,0.25)" }}>
            <StreamingPlan query={query} done={() => setPlanDone(true)} />
          </div>

          <div style={{ display: "grid", gridTemplateColumns: "1.4fr 1fr", gap: 22 }}>
            {/* in-catalog */}
            <div>
              <div style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between", marginBottom: 10 }}>
                <span className="section-label">{t.ai_in_catalog}</span>
                <span className="mono" style={{ fontSize: 11, color: "var(--ink-3)" }}>{t.ai_hits_of(ranked.length)}</span>
              </div>
              {ranked.map((s, i) => (
                <AiHitRow key={s.id} skill={s} rank={i + 1} why={reasons[i % reasons.length]} onOpen={onOpen} />
              ))}
            </div>

            {/* off-site (live Xenodia) */}
            <div>
              <div style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between", marginBottom: 10 }}>
                <span className="section-label" style={{ color: "var(--ai)" }}>{t.ai_offsite}</span>
                <span className="mono" style={{ fontSize: 11, color: "var(--ink-3)" }}>{t.ai_offsite_note}</span>
              </div>
              {remoteState.status === 'pending' && (
                <div style={{ padding: "16px", border: "1px solid var(--line)", background: "var(--bg-elev-1)", color: "var(--ink-3)", fontSize: 12.5, marginBottom: 10 }}>
                  <span className="mono" style={{ color: "var(--ai)" }}>{remoteState.statusText || t.ai_loading}</span>
                  <span className="loading-dots" />
                  <div style={{ marginTop: 6, fontSize: 11, color: "var(--ink-4)" }}>
                    通常 10–30 秒。
                  </div>
                </div>
              )}
              {remoteState.status === 'ok' && (
                <div className="remote-md"
                  dangerouslySetInnerHTML={{ __html: window.mdToHtml(remoteState.md) }} />
              )}
              {remoteState.status === 'error' && (
                <div className="err-box">
                  <b>❌ Off-site fetch failed</b>
                  {remoteState.err && remoteState.err.stage && (
                    <div className="diag">
                      <div><b>stage:</b> {remoteState.err.stage}</div>
                      <div><b>http:</b> {remoteState.err.status} {remoteState.err.statusText}</div>
                      <div><b>url:</b> {remoteState.err.url}</div>
                      <div><b>body:</b> {(remoteState.err.body || '').toString().slice(0, 240)}</div>
                    </div>
                  )}
                  {!remoteState.err?.stage && (
                    <div className="diag">{(remoteState.err?.message || String(remoteState.err)).slice(0, 240)}</div>
                  )}
                  <div style={{ marginTop: 10, fontSize: 12 }}>
                    Open <button onClick={() => window.dispatchEvent(new Event(SETTINGS_EVT))} className="mono" style={{ color: "var(--ai)", borderBottom: "1px dashed var(--ai)" }}>⚙ API settings</button> and run a Test, or check the model name.
                  </div>
                </div>
              )}
              <div style={{ padding: "10px 12px", border: "1px dashed var(--line-strong)", fontSize: 11.5, color: "var(--ink-3)", lineHeight: 1.5, marginTop: 10 }}>
                {t.ai_disclaimer}
              </div>
            </div>
          </div>
        </div>
      </section>
    );
  }

  // ── Directory ─────────────────────────────────────────────────────
  function Directory({ onOpen }) {
    const [activeTrack, setActiveTrack] = useState("research");
    const [activeTags, setActiveTags] = useState({});
    const [verifiedOnly, setVerifiedOnly] = useState(false);
    const [searchWeb, setSearchWeb] = useState(false);
    const [keyword, setKeyword] = useState("");
    const [sort, setSort] = useState("stars");
    const { t } = window.useLang();

    const trackData = window.TRACKS.find(tr => tr.id === activeTrack);
    const tagsHere = activeTags[activeTrack] || [];
    const trackLabel = t["track_" + activeTrack];

    const counts = useMemo(() => {
      const out = {};
      window.TRACKS.forEach(tr => out[tr.id] = window.SKILLS.filter(s => s.track === tr.id).length);
      return out;
    }, []);

    const subtagCounts = useMemo(() => {
      const out = {};
      trackData.subtags.forEach(st => {
        out[st.id] = window.SKILLS.filter(s => s.track === activeTrack && s.subtags.includes(st.id)).length;
      });
      return out;
    }, [activeTrack]);

    let visible = window.SKILLS.filter(s => s.track === activeTrack);
    if (tagsHere.length) visible = visible.filter(s => tagsHere.every(tag => s.subtags.includes(tag)));
    if (verifiedOnly) visible = visible.filter(s => s.verified);
    if (keyword.trim()) {
      const k = keyword.toLowerCase();
      visible = visible.filter(s =>
        s.name.toLowerCase().includes(k) ||
        s.tagline.toLowerCase().includes(k) ||
        s.author.toLowerCase().includes(k) ||
        s.subtags.some(tag => tag.includes(k))
      );
    }
    if (sort === "stars") visible = [...visible].sort((a,b) => b.stars - a.stars);
    if (sort === "new") visible = [...visible].sort((a,b) => a.addedDays - b.addedDays);
    if (sort === "verified") visible = [...visible].sort((a,b) => Number(b.verified) - Number(a.verified));
    if (sort === "abc") visible = [...visible].sort((a,b) => a.name.localeCompare(b.name));

    function toggleTag(tagId) {
      setActiveTags(prev => {
        const cur = prev[activeTrack] || [];
        const next = cur.includes(tagId) ? cur.filter(tag => tag !== tagId) : [...cur, tagId];
        return { ...prev, [activeTrack]: next };
      });
    }

    const totalVerified = window.SKILLS.filter(s => s.verified).length;
    const totalListings = window.SKILLS.length;

    return (
      <section style={{ maxWidth: 1320, margin: "0 auto", padding: "0 28px 80px" }}>
        <div style={{ display: "flex", alignItems: "flex-end", justifyContent: "space-between", marginBottom: 18 }}>
          <div>
            <div className="section-label" style={{ marginBottom: 8 }}>{t.dir_eyebrow}</div>
            <h2 style={{ fontSize: 28, fontWeight: 600, letterSpacing: "-0.02em", margin: 0 }}>
              {t.dir_h2}
            </h2>
            <p style={{ fontSize: 14, color: "var(--ink-3)", margin: "6px 0 0", maxWidth: 640 }}>
              {t.dir_intro}
            </p>
          </div>
          <div className="mono" style={{ fontSize: 11, color: "var(--ink-3)", textAlign: "right" }}>
            {t.dir_listings(totalListings)} <br />
            <span style={{ color: "var(--trust-verified)" }}>{t.dir_verified_count(totalVerified)}</span>
          </div>
        </div>

        <div style={{ display: "flex", gap: 0, marginBottom: 0 }}>
          {window.TRACKS.map((tr) => (
            <TrackTab key={tr.id} track={tr} count={counts[tr.id]}
              active={activeTrack === tr.id}
              onClick={() => setActiveTrack(tr.id)} />
          ))}
        </div>

        <div style={{
          display: "grid", gridTemplateColumns: "240px 1fr",
          border: "1px solid var(--line)", borderTop: "none",
        }}>
          {/* sidebar */}
          <aside style={{ borderRight: "1px solid var(--line)", padding: "18px 14px" }}>
            <div className="section-label" style={{ marginBottom: 4, paddingLeft: 4 }}>{t.side_subtags}</div>
            <div style={{ fontSize: 11, color: "var(--ink-3)", padding: "0 4px 10px", lineHeight: 1.4 }}>
              {t.side_subtags_hint}
            </div>
            <div style={{ display: "flex", flexDirection: "column", gap: 2 }}>
              {trackData.subtags.map(st => {
                const checked = tagsHere.includes(st.id);
                return (
                  <label key={st.id}
                    className={"tag-row " + (checked ? "is-active" : "")}
                    style={{ cursor: "pointer", position: "relative" }}>
                    <span style={{ display: "flex", alignItems: "center", gap: 9 }}>
                      <span style={{
                        width: 13, height: 13,
                        border: "1px solid " + (checked ? "var(--ai)" : "var(--line-strong)"),
                        background: checked ? "var(--ai)" : "transparent",
                        display: "inline-flex", alignItems: "center", justifyContent: "center",
                        flexShrink: 0,
                        transition: "border-color 120ms ease, background 120ms ease",
                      }}>
                        {checked && (
                          <svg width="9" height="9" viewBox="0 0 9 9" fill="none">
                            <path d="M1.5 4.5L3.5 6.5L7.5 2.5" stroke="#0a0a0f" strokeWidth="1.6" strokeLinecap="square" />
                          </svg>
                        )}
                      </span>
                      <input type="checkbox" checked={checked} onChange={() => toggleTag(st.id)}
                        style={{ position: "absolute", opacity: 0, width: 0, height: 0 }} />
                      <span>{st.label}</span>
                    </span>
                    <span className="count">{subtagCounts[st.id] || 0}</span>
                  </label>
                );
              })}
              {tagsHere.length > 0 && (
                <button
                  onClick={() => setActiveTags(prev => ({ ...prev, [activeTrack]: [] }))}
                  className="mono"
                  style={{
                    marginTop: 8, padding: "6px 10px",
                    fontSize: 11, color: "var(--ink-3)",
                    border: "1px dashed var(--line-strong)",
                    textAlign: "left",
                  }}>
                  ← {t.clear} ({tagsHere.length})
                </button>
              )}
            </div>

            <div style={{ height: 1, background: "var(--line)", margin: "16px 0" }} />

            <div className="section-label" style={{ marginBottom: 10, paddingLeft: 4 }}>{t.side_filter}</div>
            <div style={{ display: "flex", flexDirection: "column", gap: 2 }}>
              <button
                onClick={() => { setVerifiedOnly(false); setSearchWeb(false); }}
                className={"tag-row " + (!verifiedOnly && !searchWeb ? "is-active" : "")}
                style={{ width: "100%", textAlign: "left", border: "1px solid transparent" }}>
                <span style={{ display: "flex", alignItems: "center", gap: 9 }}>
                  <span style={{
                    width: 13, height: 13, borderRadius: 999,
                    border: "1px solid " + (!verifiedOnly && !searchWeb ? "var(--ink)" : "var(--line-strong)"),
                    background: !verifiedOnly && !searchWeb ? "var(--ink)" : "transparent",
                    flexShrink: 0,
                    boxShadow: !verifiedOnly && !searchWeb ? "inset 0 0 0 3px var(--bg-elev-2)" : "none",
                  }} />
                  <span>{t.filter_all}</span>
                </span>
                <span className="count">{counts[activeTrack]}</span>
              </button>

              <label className={"tag-row " + (searchWeb ? "is-active" : "")} style={{ cursor: "pointer", position: "relative" }}>
                <span style={{ display: "flex", alignItems: "center", gap: 9 }}>
                  <span style={{
                    width: 13, height: 13,
                    border: "1px solid " + (searchWeb ? "var(--ai)" : "var(--line-strong)"),
                    background: searchWeb ? "var(--ai)" : "transparent",
                    display: "inline-flex", alignItems: "center", justifyContent: "center",
                    flexShrink: 0,
                  }}>
                    {searchWeb && (
                      <svg width="9" height="9" viewBox="0 0 9 9" fill="none">
                        <path d="M1.5 4.5L3.5 6.5L7.5 2.5" stroke="#0a0a0f" strokeWidth="1.6" strokeLinecap="square" />
                      </svg>
                    )}
                  </span>
                  <input type="checkbox" checked={searchWeb} onChange={(e) => setSearchWeb(e.target.checked)}
                    style={{ position: "absolute", opacity: 0, width: 0, height: 0 }} />
                  <span>{t.filter_search_web}</span>
                </span>
                <span className="count" style={{ color: searchWeb ? "var(--ai)" : "var(--ink-3)" }}>
                  {searchWeb ? "ON" : "OFF"}
                </span>
              </label>

              <label className={"tag-row " + (verifiedOnly ? "is-active" : "")} style={{ cursor: "pointer", position: "relative" }}>
                <span style={{ display: "flex", alignItems: "center", gap: 9 }}>
                  <span style={{
                    width: 13, height: 13,
                    border: "1px solid " + (verifiedOnly ? "var(--trust-verified)" : "var(--line-strong)"),
                    background: verifiedOnly ? "var(--trust-verified)" : "transparent",
                    display: "inline-flex", alignItems: "center", justifyContent: "center",
                    flexShrink: 0,
                  }}>
                    {verifiedOnly && (
                      <svg width="9" height="9" viewBox="0 0 9 9" fill="none">
                        <path d="M1.5 4.5L3.5 6.5L7.5 2.5" stroke="#0a0a0f" strokeWidth="1.6" strokeLinecap="square" />
                      </svg>
                    )}
                  </span>
                  <input type="checkbox" checked={verifiedOnly} onChange={(e) => setVerifiedOnly(e.target.checked)}
                    style={{ position: "absolute", opacity: 0, width: 0, height: 0 }} />
                  <span>{t.filter_verified}</span>
                </span>
                <span className="count" style={{ color: verifiedOnly ? "var(--trust-verified)" : "var(--ink-3)" }}>
                  {window.SKILLS.filter(s => s.track === activeTrack && s.verified).length}
                </span>
              </label>
            </div>

            <div style={{ height: 1, background: "var(--line)", margin: "16px 0" }} />

            <div className="section-label" style={{ marginBottom: 10, paddingLeft: 4 }}>{t.side_runtime}</div>
            {["Claude Code", "Cursor", "Codex", "Gemini CLI"].map((r) => (
              <label key={r} style={{ display: "flex", alignItems: "center", gap: 10, padding: "6px 4px", fontSize: 13, color: "var(--ink-2)", cursor: "pointer" }}>
                <input type="checkbox" />
                <span className="mono" style={{ fontSize: 12.5 }}>{r}</span>
              </label>
            ))}
          </aside>

          <div>
            <div style={{
              display: "flex", alignItems: "center", justifyContent: "space-between",
              padding: "12px 18px", borderBottom: "1px solid var(--line)",
              gap: 16, flexWrap: "wrap"
            }}>
              <div className="cool-input" style={{ display: "flex", alignItems: "center", gap: 8, padding: "6px 12px", flex: 1, minWidth: 240 }}>
                <span className="mono" style={{ color: "var(--ink-3)", fontSize: 11 }}>filter ⌕</span>
                <input
                  value={keyword}
                  onChange={(e) => setKeyword(e.target.value)}
                  placeholder={t.filter_placeholder(trackLabel)}
                  style={{ fontSize: 13, flex: 1 }}
                />
                {keyword && <button onClick={() => setKeyword("")} className="mono" style={{ fontSize: 11, color: "var(--ink-3)" }}>{t.clear}</button>}
              </div>
              <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
                <span className="mono" style={{ fontSize: 11, color: "var(--ink-3)" }}>{t.sort_label}</span>
                <div className="seg">
                  {[["stars",t.sort_stars], ["new",t.sort_new], ["verified",t.sort_verified], ["abc",t.sort_abc]].map(([id,label]) => (
                    <button key={id} onClick={() => setSort(id)} className={sort === id ? "is-active" : ""}>
                      {label}
                    </button>
                  ))}
                </div>
              </div>
            </div>

            {(tagsHere.length > 0 || verifiedOnly || searchWeb) && (
              <div style={{ padding: "10px 18px", borderBottom: "1px solid var(--line)", display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap" }}>
                <span className="mono" style={{ fontSize: 11, color: "var(--ink-3)" }}>{t.active}</span>
                {tagsHere.map(tag => (
                  <button key={tag} onClick={() => toggleTag(tag)} className="mono" style={{
                    fontSize: 11, padding: "3px 8px", border: "1px solid var(--line-strong)",
                    color: "var(--ink-2)",
                  }}>{tag} ×</button>
                ))}
                {verifiedOnly && (
                  <button onClick={() => setVerifiedOnly(false)} className="mono" style={{
                    fontSize: 11, padding: "3px 8px", border: "1px solid var(--line-strong)",
                    color: "var(--trust-verified)",
                  }}>{t.filter_verified} ×</button>
                )}
                {searchWeb && (
                  <button onClick={() => setSearchWeb(false)} className="mono" style={{
                    fontSize: 11, padding: "3px 8px", border: "1px solid var(--line-strong)",
                    color: "var(--ai)",
                  }}>{t.filter_search_web} ×</button>
                )}
              </div>
            )}

            <div style={{
              display: "grid",
              gridTemplateColumns: "repeat(auto-fill, minmax(300px, 1fr))",
              gap: 0,
            }}>
              {visible.map((s) => (
                <div key={s.id} style={{ borderRight: "1px solid var(--line)", borderBottom: "1px solid var(--line)" }}>
                  <SkillCard skill={s} onOpen={onOpen} />
                </div>
              ))}
              {visible.length === 0 && (
                <div style={{ padding: 60, color: "var(--ink-3)", fontSize: 14, gridColumn: "1 / -1", textAlign: "center" }}>
                  {t.no_match}
                </div>
              )}
            </div>

            <div style={{
              padding: "12px 18px", borderTop: "1px solid var(--line)",
              display: "flex", justifyContent: "space-between", alignItems: "center",
              fontFamily: "var(--font-mono)", fontSize: 11, color: "var(--ink-3)"
            }}>
              <span>{t.showing(visible.length, counts[activeTrack], trackLabel)}</span>
              <span>{t.updated}</span>
            </div>
          </div>
        </div>
      </section>
    );
  }

  // ── Detail overlay ────────────────────────────────────────────────
  function DetailOverlay({ skill, onClose }) {
    const { t } = window.useLang();
    useEffect(() => {
      if (!skill) return;
      const onKey = (e) => { if (e.key === "Escape") onClose(); };
      window.addEventListener("keydown", onKey);
      return () => window.removeEventListener("keydown", onKey);
    }, [skill]);
    if (!skill) return null;

    const related = window.SKILLS.filter(s => s.id !== skill.id && s.track === skill.track).slice(0, 4);

    return (
      <div className="detail-overlay" onClick={onClose}>
        <div className="detail-panel" onClick={(e) => e.stopPropagation()}>
          <div style={{ padding: "32px 36px", borderRight: "1px solid var(--line)" }}>
            <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 16 }}>
              <TrustBadge verified={skill.verified} />
              <span className="adopt-live"><span className="pulse" />{t.install_count(skill.adopted)}</span>
              <button onClick={onClose} style={{ marginLeft: "auto", color: "var(--ink-3)", fontSize: 13, fontFamily: "var(--font-mono)" }}>
                {t.detail_close}
              </button>
            </div>
            <h1 style={{ fontSize: 34, fontWeight: 600, letterSpacing: "-0.02em", margin: 0 }}>{skill.name}</h1>
            <p style={{ fontSize: 16, color: "var(--ink-2)", margin: "8px 0 24px", lineHeight: 1.5 }}>{skill.tagline}</p>
            <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 28 }}>
              {skill.subtags.map(tag => (
                <span key={tag} className="mono" style={{ fontSize: 11, color: "var(--ink-2)", padding: "3px 8px", border: "1px solid var(--line)" }}>{tag}</span>
              ))}
            </div>
            <div style={{ marginBottom: 28 }}>
              <div className="section-label" style={{ marginBottom: 10 }}>{t.about}</div>
              <p style={{ fontSize: 15, color: "var(--ink)", lineHeight: 1.65, margin: 0 }}>{skill.description}</p>
            </div>
            <div style={{ marginBottom: 28 }}>
              <div className="section-label" style={{ marginBottom: 10 }}>{t.use_cases}</div>
              <ul style={{ paddingLeft: 18, margin: 0 }}>
                {skill.scenarios.map(s => (
                  <li key={s} style={{ fontSize: 14, color: "var(--ink-2)", lineHeight: 1.7 }}>{s}</li>
                ))}
              </ul>
            </div>
            <div style={{ marginBottom: 28 }}>
              <div className="section-label" style={{ marginBottom: 10 }}>{t.install}</div>
              <div style={{
                padding: "14px 16px", border: "1px solid var(--line)",
                background: "var(--bg-elev-2)", fontFamily: "var(--font-mono)", fontSize: 13,
                display: "flex", justifyContent: "space-between", alignItems: "center",
              }}>
                <span><span style={{ color: "var(--ai)" }}>$</span> {skill.install}</span>
                <button onClick={() => navigator.clipboard?.writeText(skill.install)} className="mono" style={{ fontSize: 11, color: "var(--ink-3)" }}>{t.copy}</button>
              </div>
              <div style={{ marginTop: 8, fontSize: 12, color: "var(--ink-3)", fontFamily: "var(--font-mono)" }}>
                {t.compatible(skill.runtime)}
              </div>
            </div>
            <div>
              <div className="section-label" style={{ marginBottom: 10 }}>{t.source}</div>
              <a href={skill.repoUrl} target="_blank" rel="noreferrer" className="link-mono" style={{ fontSize: 14 }}>
                {skill.repo} ↗
              </a>
              <div style={{ marginTop: 6, fontSize: 11, color: "var(--ink-3)", fontFamily: "var(--font-mono)" }}>
                {skill.verified ? t.rechecked(skill.addedDays, skill.stars) : t.training_only}
              </div>
            </div>
          </div>

          <aside style={{ padding: "32px 24px", position: "sticky", top: 0, alignSelf: "flex-start" }}>
            <a href={skill.repoUrl} target="_blank" rel="noreferrer" style={{
              display: "block", width: "100%", padding: "14px 16px", background: "var(--ai)",
              color: "var(--bg)", fontWeight: 600, fontSize: 14, letterSpacing: "0.02em",
              marginBottom: 10, textAlign: "center", textDecoration: "none",
            }}>{t.install_btn}</a>
            <button style={{
              width: "100%", padding: "12px 16px", border: "1px solid var(--line-strong)",
              color: "var(--ink-2)", fontSize: 13, fontFamily: "var(--font-mono)",
            }}>{t.save_btn}</button>

            <div style={{ height: 1, background: "var(--line)", margin: "24px 0" }} />

            <div className="section-label" style={{ marginBottom: 12 }}>{t.at_glance}</div>
            <dl style={{ margin: 0, fontSize: 12.5 }}>
              {[
                [t.field_author, skill.author],
                [t.field_stars, "★ " + skill.stars.toLocaleString()],
                [t.field_added, t.added_ago(skill.addedDays)],
                [t.field_trust, skill.verified ? t.trust_verified : t.trust_training],
              ].map(([k,v]) => (
                <div key={k} style={{ display: "flex", justifyContent: "space-between", padding: "7px 0", borderBottom: "1px solid var(--line)" }}>
                  <dt style={{ color: "var(--ink-3)", fontFamily: "var(--font-mono)", fontSize: 11 }}>{k}</dt>
                  <dd style={{ margin: 0, color: "var(--ink)" }}>{v}</dd>
                </div>
              ))}
            </dl>

            <div className="section-label" style={{ margin: "24px 0 12px" }}>{t.related_in(t["track_" + skill.track])}</div>
            <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
              {related.map(r => (
                <div key={r.id} style={{ padding: "10px 12px", border: "1px solid var(--line)", cursor: "pointer" }}>
                  <div style={{ fontSize: 13, fontWeight: 500 }}>{r.name}</div>
                  <div className="mono" style={{ fontSize: 10.5, color: "var(--ink-3)", marginTop: 2 }}>
                    ★ {r.stars.toLocaleString()} · {r.subtags[0]}
                  </div>
                </div>
              ))}
            </div>
          </aside>
        </div>
      </div>
    );
  }

  // ── Settings modal ────────────────────────────────────────────────
  function SettingsModal() {
    const { t } = window.useLang();
    const [open, setOpen] = useState(false);
    const [cfg, setCfg] = useState(window.getCfg());
    const [status, setStatus] = useState({ kind: 'idle', text: '' });

    useEffect(() => {
      const onOpen = () => { setCfg(window.getCfg()); setOpen(true); };
      window.addEventListener(SETTINGS_EVT, onOpen);
      return () => window.removeEventListener(SETTINGS_EVT, onOpen);
    }, []);

    function save(){
      const next = {
        baseUrl: (cfg.baseUrl || 'https://api.xenodia.xyz').trim().replace(/\/+$/, ''),
        apiKey: cfg.apiKey.trim(),
        model: (cfg.model || 'claude-sonnet-4-6').trim(),
      };
      window.saveCfg(next);
      setStatus({ kind: 'ok', text: '✓ saved' });
      setTimeout(() => setOpen(false), 500);
    }

    async function test(){
      setStatus({ kind: 'pending', text: 'testing…' });
      try {
        const data = await window.callApi(cfg, {
          model: cfg.model || 'claude-sonnet-4-6',
          max_tokens: 32,
          messages: [{ role: 'user', content: 'ping. reply with one word: pong.' }],
        });
        const txt = window.extractText(data);
        setStatus({ kind: 'ok', text: '✓ connected · ' + txt.slice(0, 30) });
      } catch (err) {
        setStatus({ kind: 'err', text: '❌ ' + (err.stage ? `${err.stage} ${err.status} ${(err.body||'').slice(0,140)}` : (err.message || err)) });
      }
    }

    function clearKey(){
      window.saveCfg({});
      setCfg({ ...cfg, apiKey: '' });
      setStatus({ kind: 'idle', text: 'cleared' });
    }

    return (
      <div className={"modal-bg " + (open ? "open" : "")} onClick={() => setOpen(false)}>
        <div className="modal-card" onClick={(e) => e.stopPropagation()}>
          <h2>{t.set_title}</h2>
          <p className="lede">{t.set_lede}</p>
          <div className="field">
            <label>{t.set_base}</label>
            <input value={cfg.baseUrl} onChange={(e) => setCfg({ ...cfg, baseUrl: e.target.value })} placeholder="https://api.xenodia.xyz" />
            <div className="hint">{t.set_base_hint}</div>
          </div>
          <div className="field">
            <label>{t.set_key}</label>
            <input type="password" value={cfg.apiKey} onChange={(e) => setCfg({ ...cfg, apiKey: e.target.value })} placeholder="JWT or sk-..." />
            <div className="hint">{t.set_key_hint}</div>
          </div>
          <div className="field">
            <label>{t.set_model}</label>
            <input value={cfg.model} onChange={(e) => setCfg({ ...cfg, model: e.target.value })} placeholder="claude-sonnet-4-6" />
            <div className="hint">{t.set_model_hint}</div>
          </div>
          <div style={{ display: "flex", gap: 10, alignItems: "center", marginTop: 18, flexWrap: "wrap" }}>
            <button onClick={save} style={{
              padding: "10px 16px", background: "var(--ai)", color: "var(--bg)",
              fontWeight: 600, fontSize: 13, fontFamily: "var(--font-mono)",
            }}>{t.set_save}</button>
            <button onClick={test} className="mono" style={{
              padding: "10px 14px", border: "1px solid var(--line-strong)", color: "var(--ink-2)", fontSize: 12.5,
            }}>🩺 {t.set_test}</button>
            <button onClick={clearKey} className="mono" style={{
              padding: "10px 14px", border: "1px solid var(--line-strong)", color: "var(--ink-3)", fontSize: 12.5,
            }}>{t.set_clear}</button>
            <span className="mono" style={{
              fontSize: 11.5, color: status.kind === 'err' ? 'var(--warn)' : status.kind === 'ok' ? 'var(--trust-verified)' : 'var(--ink-3)',
              flex: 1, minWidth: 200, wordBreak: "break-all",
            }}>{status.text}</span>
          </div>
        </div>
      </div>
    );
  }

  // ── Footer ────────────────────────────────────────────────────────
  function Footer() {
    const { t } = window.useLang();
    return (
      <footer style={{ borderTop: "1px solid var(--line)", padding: "32px 28px 60px" }}>
        <div style={{
          maxWidth: 1320, margin: "0 auto",
          display: "grid", gridTemplateColumns: "2fr 1fr 1fr 1fr", gap: 32,
        }}>
          <div>
            <div style={{ fontWeight: 600, marginBottom: 8 }}>{t.foot_brand}</div>
            <p style={{ fontSize: 13, color: "var(--ink-3)", lineHeight: 1.6, maxWidth: 360, margin: 0 }}>
              {t.foot_about}
            </p>
          </div>
          {[
            [t.foot_discover, [t.track_research, t.track_trading, t.track_writing, t.nav_leaderboard]],
            [t.foot_builders, [t.foot_submit, t.foot_rules, t.foot_style]],
            [t.foot_trust, [t.foot_how, t.foot_report, t.foot_changelog]],
          ].map(([h, items]) => (
            <div key={h}>
              <div className="section-label" style={{ marginBottom: 12 }}>{h}</div>
              {items.map(i => (
                <div key={i} style={{ fontSize: 13, color: "var(--ink-2)", padding: "4px 0" }}>{i}</div>
              ))}
            </div>
          ))}
        </div>
        <div style={{
          maxWidth: 1320, margin: "32px auto 0", paddingTop: 18, borderTop: "1px solid var(--line)",
          display: "flex", justifyContent: "space-between", fontSize: 11.5, color: "var(--ink-3)", fontFamily: "var(--font-mono)",
        }}>
          <span>{t.foot_copy}</span>
          <span>{t.foot_built}</span>
        </div>
      </footer>
    );
  }

  // ── App ───────────────────────────────────────────────────────────
  function App() {
    const [aiQuery, setAiQuery] = useState("");
    const [aiInputValue, setAiInputValue] = useState("");
    const [focused, setFocused] = useState(false);
    const [openSkill, setOpenSkill] = useState(null);

    function handleSearch(q) {
      setAiQuery(q);
      setTimeout(() => {
        const el = document.getElementById("ai-panel-anchor");
        if (el) {
          const top = el.getBoundingClientRect().top + window.scrollY - 40;
          window.scrollTo({ top, behavior: "smooth" });
        }
      }, 120);
    }

    return (
      <div className={"page-dim " + (focused ? "is-focused" : "")}>
        <TopNav />
        <Hero
          focused={focused}
          setFocused={setFocused}
          value={aiInputValue}
          setValue={setAiInputValue}
          onSearch={handleSearch}
        />
        <div id="ai-panel-anchor" />
        {aiQuery && (
          <AiPanel
            query={aiQuery}
            onClose={() => setAiQuery("")}
            onOpen={(s) => setOpenSkill(s)}
          />
        )}
        <Directory onOpen={(s) => setOpenSkill(s)} />
        <Footer />
        <DetailOverlay skill={openSkill} onClose={() => setOpenSkill(null)} />
        <SettingsModal />
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
